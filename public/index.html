<!doctype html>
<html lang="en" data-site="{{SITE_NAME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SITE_NAME}}</title>
<meta name="description" content="{{TAGLINE}}. In-game currency only, 18+.">
<link rel="icon" href="/img/donut.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<main>
  <div id="verify-banner"></div>
  <section class="hero">
    <h1>{{SITE_NAME}}</h1>
    <p>Casino games played with in-game donuts. 18+. Donuts have no real-money value.</p>
    <div class="cta" id="hero-cta"></div>
  </section>
  <div id="bot-card" style="max-width:420px;margin:-8px 0 28px"></div>

  <div class="section-title"><h2>Games</h2></div>
  <div class="games-grid" id="games-grid"></div>

  <div class="section-title" style="margin-top:32px"><h2>Recent bets</h2></div>
  <div id="history"></div>
</main>
<script src="/js/common.js"></script>
<script src="/js/lobby.js"></script>
</body>
</html>
